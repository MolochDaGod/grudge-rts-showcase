<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grudge RTS — 3D Model Showcase</title>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts — Grudge Fantasy Theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Spectral+SC:wght@400;600;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header id="app-header">
    <div class="header-left">
      <i class="fa-solid fa-chess-rook header-icon"></i>
      <h1>Grudge RTS</h1>
    </div>
    <div class="header-right">
      <button id="btn-api-status" class="btn-icon" title="API Status">
        <i class="fa-solid fa-signal"></i>
        <span id="api-status-dot" class="status-dot offline"></span>
      </button>
      <button id="btn-login" class="btn-gold" title="Login via Grudge Platform">
        <i class="fa-brands fa-discord"></i> Connect
      </button>
      <div id="user-badge" class="user-badge hidden">
        <img id="user-avatar" src="" alt="" class="user-avatar" />
        <span id="user-name"></span>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main id="app-main">
    <!-- Sidebar: Model Selector -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-cubes"></i>
        <h2>Buildings</h2>
      </div>
      <ul id="model-list"></ul>
      <div class="sidebar-footer">
        <span class="badge"><i class="fa-solid fa-box-open"></i> <span id="model-count">0</span> models</span>
      </div>
    </aside>

    <!-- 3D Viewport -->
    <section id="viewport-container">
      <canvas id="viewport"></canvas>

      <!-- Viewport Overlay Controls -->
      <div id="viewport-controls">
        <button id="btn-reset-cam" class="btn-icon" title="Reset Camera">
          <i class="fa-solid fa-crosshairs"></i>
        </button>
        <button id="btn-wireframe" class="btn-icon" title="Toggle Wireframe">
          <i class="fa-solid fa-border-all"></i>
        </button>
        <button id="btn-rotate" class="btn-icon active" title="Auto-Rotate">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <button id="btn-fullscreen" class="btn-icon" title="Fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>

      <!-- Model Info Overlay -->
      <div id="model-info" class="hidden">
        <h3 id="model-name"></h3>
        <div class="model-stats">
          <span><i class="fa-solid fa-shapes"></i> <span id="model-triangles">0</span> tris</span>
          <span><i class="fa-solid fa-layer-group"></i> <span id="model-meshes">0</span> meshes</span>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loading-overlay" class="hidden">
        <i class="fa-solid fa-spinner fa-spin-pulse fa-3x"></i>
        <p>Loading model…</p>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer id="app-footer">
    <span><i class="fa-solid fa-shield-halved"></i> Grudge Studio &copy; 2026</span>
    <span class="footer-sep">|</span>
    <a href="https://www.grudgeplatform.com" target="_blank" rel="noopener">
      <i class="fa-solid fa-globe"></i> grudgeplatform.com
    </a>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
